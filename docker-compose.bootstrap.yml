# ZEEHIVE — one-file bootstrap. No checkout, no build: published images only.
#
#   curl -fsSLO https://raw.githubusercontent.com/Originode/Zeehive/master/docker-compose.bootstrap.yml
#   docker compose -f docker-compose.bootstrap.yml up -d
#
# On first boot the server migrates its own fresh meta-DB, then SELF-ONBOARDS: it clones the
# ZEEHIVE repo from GitHub into the repos volume and registers it as its first project. Console
# on http://localhost:5180 (API :4700). Connect a Claude token in Project setup → Tokens, raise
# the pool target, and dispatch. Fresh restart-from-zero = delete the zeehive_meta_data and
# zeehive_repos volumes and `up -d` again.
#
# Run your own fork: override ZEEHIVE_SELF_REMOTE (and ZEEHIVE_GITHUB_TOKEN for a private repo —
# a fine-grained PAT with Contents: Read-only) in a .env file next to this one.
#
# Onboard a project that lives on YOUR machine (instead of cloning it): the console does this
# for you — Onboard → Existing folder → "mount a folder from the host machine…" (the queenzee
# recreates its own container to take the bind; mounts persist in /repos/.zeehive-mounts.yml).
# The manual equivalent, if you prefer to own the compose invocation —
#   # mount-my-project.yml
#   services:
#     server:
#       volumes:
#         - D:\Repos\MyProject:/repos/MyProject     # host path : container path
#   docker compose -f docker-compose.bootstrap.yml -f mount-my-project.yml up -d
# Know the tradeoffs: Docker Desktop bind mounts are much slower than the named volume for
# git-heavy work, a Windows checkout brings CRLF along, and the queenzee's zees write that tree —
# don't fight them from a host editor mid-run. Clone-from-GitHub remains the smoothest path.
name: zeehive
services:
  meta-db:
    image: postgres:17-alpine
    container_name: zeehive_meta_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: zeehive
      POSTGRES_PASSWORD: zeehive
      POSTGRES_DB: zeehive
    volumes:
      - zeehive_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeehive"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    # Overridable so a stack that has SHIPPED itself is not silently reverted. Ships replace these
    # containers with locally built images (zeehive-server:prod / zeehive-web:prod); re-running
    # `up -d` here — to add an env var, say — reconciles them straight back to the published tag
    # and undoes the deploy with no warning. If you build from source, set ZEEHIVE_SERVER_IMAGE and
    # ZEEHIVE_WEB_IMAGE in the .env next to this file.
    image: ${ZEEHIVE_SERVER_IMAGE:-ghcr.io/originode/zeehive-server:latest}
    container_name: zeehive_server
    restart: unless-stopped
    # 4700 is the API; 4701 is the LLM GATEWAY (GATEWAY_PORT — the door every cxell CLI points its
    # provider base-urls at). 4701 was unpublished once and every provider failed with the vendor's
    # words for 13h (TKT-179): host.docker.internal:4701 is what a cage uses, and it only resolves
    # when THIS port is published. Never unpublish it. The RANGE is xell webapp PREVIEW ports
    # (docs/visual-verification-
    # diagnosis.md §7): the meta-DB allocates each xell webapp a unique fleet-wide port
    # (project.port_web_base + slot, mod port_slot_mod — Zeehive 5300-5389), the app-tier
    # processes run INSIDE this container, and lib/preview-ports.js makes every such port
    # answer on this container's external interface. Publishing the range is what carries
    # them to the host, so a human opens http://<this-host>:<port>/ directly — no path prefix.
    # THE RULE (outage 2026-08-08): the server publishes ranges ONLY for process-runner (xhip)
    # projects, whose app tiers run inside THIS container. Never publish a COMPOSE project's
    # container range — those projects' spin containers publish their own host ports, so
    # mapping the same range here makes docker refuse this service's entire network endpoint
    # the moment any spin container holds one port of it. Adding a new project's range
    # requires checking it cannot collide with fleet container ports; keep this file and
    # docker/zeehive/docker-compose.prod.yml in lockstep.
    ports:
      - "4700:4700"
      - "4701:4701"
      - "5300-5389:5300-5389"
    depends_on:
      meta-db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://zeehive:zeehive@meta-db:5432/zeehive
      DOCKER_HOST: unix:///var/run/docker.sock
      PROVISION_MODE: real
      REPOS_DIR: /repos
      ZEEHIVE_SELF_REMOTE: ${ZEEHIVE_SELF_REMOTE:-https://github.com/Originode/Zeehive.git}
      ZEEHIVE_GITHUB_TOKEN: ${ZEEHIVE_GITHUB_TOKEN:-}
      ZEEHIVE_SSH_DIR: /data/ssh
      BACKUP_DIR: /backups
      # Backups are REAL by default. Left unset, maintenance.js falls back to 'simulate', which
      # writes a ~150-byte comment file and records it as a finished backup — indistinguishable in
      # the UI from a real dump of a 4.5GB production database, and one click from restoring
      # nothing over a live DB (see 9169c1b). Simulate is a demo mode; opt INTO it, never into it
      # by omission. MAINTENANCE_ENABLED arms the scheduler; MODE decides real vs placeholder.
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-real}
      MAINTENANCE_ENABLED: ${MAINTENANCE_ENABLED:-true}
      # Worktree-only provisioning by default. The app tier runs the PROJECT's own spin-env.sh,
      # which needs the main checkout's .env — a file a fresh `git clone` never has, because it is
      # gitignored. provision.js defaults this ON, so a containerized queenzee provisioning a
      # cloned project failed on every attempt (2026-07-22: 396 orphaned worktrees, 139GB, engine
      # wedged). Turn it on per-install once the project's dev tier is genuinely wired up.
      PROVISION_APP_TIER: ${PROVISION_APP_TIER:-false}
      # cxells (the zees' containers) are spawned from the published image and reach the
      # queenzee at the STABLE address: host.docker.internal:4700 (the queenzee's published port
      # on the host). This is the injected ZEEHIVE_API — it always resolves and only fails with a
      # legible connection-refused while the queenzee is down, never the DNS ENOTFOUND that a
      # service name gives while the container is being recreated (ticket #94). cxellRunArgs adds
      # the host.docker.internal:host-gateway alias to every cage, so this is NOT a host-networking
      # assumption — it works the same on Docker Desktop (win/mac) and native Linux. The compose
      # service name stays as the EXPLICIT fallback (ZEEHIVE_API_FALLBACK), for a script that has
      # to reach the queenzee when host publishing is unavailable.
      CXELL_IMAGE: ghcr.io/originode/zeehive-zee-agent:latest
      CXELL_API_BASE: http://host.docker.internal:4700
      CXELL_API_FALLBACK: http://zeehive_server:4700
      # The EXTERNALLY-REACHABLE base URL for /api/ext/v1 — the address a DEPLOYED project on
      # another host uses to file tickets (docs/ticketing-api.md §0). NOT host.docker.internal
      # (that means the caller's own docker host). Pass through the operator's explicit answer;
      # unset, the server falls back to DEV_HOST_IP or reports base_url:null.
      EXT_API_BASE: ${EXT_API_BASE:-}
      # The NetBird mesh control plane (docs/netbird-mesh-plan.md). BOTH NETBIRD_API_URL and
      # NETBIRD_API_TOKEN unset (the default) = the mesh is disabled and every mesh path in the
      # queenzee is a legible no-op — today's behaviour on a mesh-less install is unchanged. Set
      # them in the .env next to this file (never in a committed compose) after the mesh profile's
      # control plane is up; the token is a real secret — config.js surfaces presence only.
      NETBIRD_API_URL: ${NETBIRD_API_URL:-}
      NETBIRD_API_TOKEN: ${NETBIRD_API_TOKEN:-}
      MESH_DOMAIN: ${MESH_DOMAIN:-netbird.selfhosted}
      ZEEHIVE_CXELL_SSH: network
    # host-gateway: a containerized queenzee reaches host-published services (e.g. the shared dev
    # database port) at host.docker.internal:<port>. Docker Desktop adds that name automatically;
    # native Linux needs the alias, exactly like the web service below.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zeehive_repos:/repos
      - /var/run/docker.sock:/var/run/docker.sock
      - zeehive_ssh:/data/ssh
      - zeehive_backups:/backups
    # zee-hive-net (the cxell network) is deliberately NOT declared here: the entrypoint creates
    # and joins it idempotently — a compose-owned network would refuse any pre-existing one.

  web:
    image: ${ZEEHIVE_WEB_IMAGE:-ghcr.io/originode/zeehive-web:latest}
    container_name: zeehive_web
    restart: unless-stopped
    ports: ["5180:5180"]
    # the bundled nginx proxies /api → host.docker.internal:4700 (the server's published port);
    # host-gateway makes that name resolve on native Linux too
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [server]

  # ── NETBIRD MESH control plane (docs/netbird-mesh-plan.md §3.1) — profile-gated ──────────────
  # Self-hosted NetBird — management (the REST/gRPC API lib/netbird.js drives), signal (the
  # coordination service agents negotiate through), relay (the NAT-traversal fallback) and the
  # optional dashboard — on the SAME compose project, so the queenzee's server container can reach
  # management by service name (netbird-management) on this network. They are gated behind the
  # `mesh` PROFILE: an unscoped `up -d` boots the exact pre-mesh stack, and the mesh stays off
  # until a human deliberately stands it up (docker/zeehive/README.md → "The NetBird mesh
  # control plane") AND sets NETBIRD_API_URL/NETBIRD_API_TOKEN on the server service.
  #
  # Live stand-up is a HUMAN's deploy, not the queenzee's: NetBird moves fast — pin the tags and
  # verify the management.json shape against the NetBird docs for the tag you chose before you
  # rely on it. The management DATABASE (netbird_management_data) is a ONE-WAY DOOR: losing it
  # orphans every joined peer (the meta-DB only records intent; the control plane is the live
  # truth). Back it up before any teardown — see the README section above.
  netbird-management:
    profiles: ["mesh"]
    image: netbirdio/management:${NETBIRD_MANAGEMENT_TAG:-latest}
    container_name: zeehive_netbird_management
    restart: unless-stopped
    # 33073 is the agents' gRPC API; the published HTTPS port is the management HTTP API (the one
    # lib/netbird.js speaks). Defaults avoid every queenzee/spin port (4700/4701/5180/5300-5389).
    ports:
      - "${NETBIRD_MGMT_GRPC_PORT:-33073}:33073"
      - "${NETBIRD_MGMT_API_PORT:-33074}:443"
    volumes:
      - netbird_management_data:/var/lib/netbird
      # The management needs a management.json (signal/relay/stun + datastore + auth). Stand-alone
      # installs create ./netbird/management.json next to this file from the shipped example
      # (docker/zeehive/netbird/management.json.example in a repo checkout). `config -q` does not
      # stat host paths, so the mesh profile can stay defined here whether or not the file exists;
      # `up --profile mesh` refuses until a human writes it.
      - ./netbird/management.json:/etc/netbird/management.json:ro
    command:
      - "--port"
      - "443"
      - "--log-file"
      - "console"
      - "--dns-domain"
      - "${MESH_DOMAIN:-netbird.selfhosted}"
      - "--disable-anonymous-metrics=${NETBIRD_DISABLE_ANONYMOUS_METRICS:-true}"

  netbird-signal:
    profiles: ["mesh"]
    image: netbirdio/signal:${NETBIRD_SIGNAL_TAG:-latest}
    container_name: zeehive_netbird_signal
    restart: unless-stopped
    ports:
      - "${NETBIRD_SIGNAL_PORT:-10000}:80"
    volumes:
      - netbird_signal_data:/var/lib/netbird
    command: ["--port", "80", "--log-file", "console"]

  netbird-relay:
    profiles: ["mesh"]
    image: netbirdio/relay:${NETBIRD_RELAY_TAG:-latest}
    container_name: zeehive_netbird_relay
    restart: unless-stopped
    ports:
      - "${NETBIRD_RELAY_PORT:-33080}:${NETBIRD_RELAY_PORT:-33080}"
    environment:
      NB_LOG_LEVEL: info
      NB_LISTEN_ADDRESS: ":${NETBIRD_RELAY_PORT:-33080}"
      NB_EXPOSED_ADDRESS: ${NETBIRD_RELAY_ENDPOINT:-}
      NB_AUTH_SECRET: ${NETBIRD_RELAY_AUTH_SECRET:-}

  netbird-dashboard:
    profiles: ["mesh"]
    image: netbirdio/dashboard:${NETBIRD_DASHBOARD_TAG:-latest}
    container_name: zeehive_netbird_dashboard
    restart: unless-stopped
    # OPTIONAL — the human UI only. The mesh works without it (the API + agents never need it),
    # and it needs an OIDC provider (AUTH_AUTHORITY/AUTH_CLIENT_ID/…) before it can sign anyone
    # in. Published on 33081 by default so it never fights the web dashboard's 5180.
    ports:
      - "${NETBIRD_DASH_HTTP_PORT:-33081}:80"
    environment:
      # Flat passthroughs only — compose does NOT recursively interpolate a default that itself
      # contains ${…}, so the operator sets these to the endpoints they actually publish.
      NETBIRD_MGMT_API_ENDPOINT: ${NETBIRD_MGMT_API_ENDPOINT:-}
      NETBIRD_MGMT_GRPC_API_ENDPOINT: ${NETBIRD_MGMT_GRPC_API_ENDPOINT:-}
      AUTH_AUTHORITY: ${NETBIRD_AUTH_AUTHORITY:-}
      AUTH_AUDIENCE: ${NETBIRD_AUTH_AUDIENCE:-}
      AUTH_CLIENT_ID: ${NETBIRD_AUTH_CLIENT_ID:-}
      AUTH_CLIENT_SECRET: ${NETBIRD_AUTH_CLIENT_SECRET:-}
      AUTH_REDIRECT_URI: ${NETBIRD_AUTH_REDIRECT_URI:-}

  # ── MESH GATEWAY (docs/netbird-mesh-plan.md §3.5) — the cxells' data-plane hop ────────────────
  # A NetBird AGENT (a peer — not control plane) on zee-hive-net, the one network every cxell is
  # already on. It is the queenzee machine's `gateway` peer: ip_forward toward the mesh, so a caged
  # zee (no TUN device, no per-cage agent) reaches mesh addresses by routing 100.64.0.0/10 through
  # this container — the one `ip route` line cxell-firewall.sh adds. Profile-gated like the control
  # plane; an unscoped `up -d` boots the exact pre-mesh stack.
  #
  # Live stand-up is a HUMAN's deploy: the peer needs a one-time gateway setup key minted against
  # the running control plane (NETBIRD_GATEWAY_SETUP_KEY — never committed), and the management URL
  # must be the endpoint the operator's management actually serves. Attached to BOTH the compose
  # network (so `netbird-management` resolves for the agent's control connection) and zee-hive-net
  # (so cages can route through it). zee-hive-net is EXTERNAL: the queenzee's entrypoint creates it
  # idempotently, and compose must never own it.
  mesh-gateway:
    profiles: ["mesh"]
    image: netbirdio/netbird:${NETBIRD_CLIENT_TAG:-latest}
    container_name: zeehive_mesh_gateway
    restart: unless-stopped
    hostname: zeehive-gw
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      NB_SETUP_KEY: ${NETBIRD_GATEWAY_SETUP_KEY:-}
      NB_MANAGEMENT_URL: ${NETBIRD_MGMT_API_URL:-https://netbird-management:443}
      NB_HOSTNAME: zeehive-gw
    networks:
      - default
      - zee-hive-net

volumes:
  # explicit names: scripts (e.g. the self-ship sibling) mount these by bare name
  zeehive_meta_data: { name: zeehive_meta_data }
  zeehive_repos: { name: zeehive_repos }
  zeehive_ssh: { name: zeehive_ssh }
  zeehive_backups: { name: zeehive_backups }
  # NetBird control-plane data. Explicit names, same rule as the zeehive_* volumes — the self-ship
  # sibling and the mesh README steps mount these by bare name.
  netbird_management_data: { name: netbird_management_data }
  netbird_signal_data: { name: netbird_signal_data }

networks:
  default: {}
  # The one network every cxell is already on — EXTERNAL by design: the queenzee's entrypoint
  # creates it idempotently, and compose must never own it (a compose-owned network would refuse a
  # pre-existing one). Only the mesh-gateway joins it from compose.
  zee-hive-net:
    external: true
    name: zee-hive-net
