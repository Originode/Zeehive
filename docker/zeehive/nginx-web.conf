# The production dashboard's server half: static SPA + /api proxy to the queenzee on the host.
#
# One /api proxy carries THREE kinds of traffic to the queenzee: plain JSON, the SSE event
# stream, and the cxell-zee terminal WEBSOCKET. The map makes Connection correct for each —
# 'upgrade' when the client sends an Upgrade header (the websocket), empty otherwise (SSE must
# NOT get a Connection: upgrade, and a persistent stream wants it cleared).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}
server {
  listen 5180;
  root /usr/share/nginx/html;

  # The queenzee API — host process (self-ship pattern) reached through Docker Desktop's
  # host gateway. SSE + websocket ride this too, hence: no buffering (a live stream must not sit
  # in a proxy buffer), HTTP/1.1 with Upgrade/Connection driven by the map, and a read timeout
  # long enough that an idle event stream or terminal is never cut mid-day.
  location /api/ {
    proxy_pass http://host.docker.internal:4700;
    proxy_http_version 1.1;
    # $http_host (host:port) not $host (port-stripped): the queenzee derives the
    # browser-facing /api base from the Host header for the Langfuse one-time-signin-token
    # redemption URL (routes.js redeemBaseOf) — a stripped port would send the browser to
    # port 80. Nothing else reads this header.
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  # Xell webapp review (docs/common-xell-network-plan.md) — /xell-web/<slug>/* is the reachable
  # URL for every xell's Vite dev server. Same proxy shape as /api/ (Vite HMR is a websocket, the
  # xell's own /api rides SSE/ws): no buffering, HTTP/1.1 Upgrade/Connection from the map, long
  # read timeout. The upstream is the QUEENZEE's express server — the /xell-web route lives next to
  # /api on the same :4700 (the browser-facing prefix is /xell-web, the express route is
  # /api/xell-web — this block bridges the two).
  location /xell-web/ {
    proxy_pass http://host.docker.internal:4700/api/xell-web/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
  }

  # THE SHELL MUST NEVER BE CACHED. index.html is the only file that names the current bundle
  # (vite content-hashes every asset), and nginx sends static files with no Cache-Control at all —
  # so a browser applies HEURISTIC freshness (a fraction of the file's age) and can serve a stale
  # index.html for hours WITHOUT revalidating. That is a shipped console fix nobody can see: the
  # bug it hid here was the ❖ environment panel's 404, deployed and verified in the container while
  # the human's browser kept loading the previous bundle and reported "still the same". `no-cache`
  # means revalidate, not "do not store" — the ETag above still turns the usual load into a 304.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The hashed assets are the opposite case: their NAME changes with their content, so they can be
  # cached hard and forever. This is what keeps `no-cache` on the shell cheap.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback — client-side routes resolve to the app shell. The internal redirect re-runs
  # location matching, so the fallback shell is served by the `= /index.html` block above and
  # carries its no-cache header too.
  location / {
    try_files $uri /index.html;
  }
}
