version: 1
label: Crew Lead
summary: Runs a DEV CREW — reads a piece of work, picks the specialist role it needs, and dispatches that role.
glyph: "⬡"

# INHERITS the manager harness, and adds ONE thing: the roster of dev roles and the judgement of
# which role a piece of work needs. Everything else a lead does — how to run a crew, how to brief a
# worker, what it may never ask one for — is the PARENT's, merged in root→leaf by effectiveHarness().
# Nothing here restates it: a copy is a second version of the manual that rots on its own schedule.
parent: manager

# A lead IS a manager zee (it dispatches; it writes no code and lands nothing). Same type as the
# parent — and it must be, since a harness may only inherit within its own type (054).
zee_type: manager

memory:
  - memory/dev-role-roster.md

skills:
  - pick-the-role
