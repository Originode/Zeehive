version: 1
label: Manager Zee
summary: Coordinates a crew of worker zees — dispatches, monitors, converses, suggests done. Writes no code, lands nothing.
glyph: "⬢"

# WHICH TYPE OF ZEE THIS IS FOR. A harness carries the manual for a type's verbs and refusals, so it
# may only be worn by a xell of that type: this one teaches `zee dispatch` / `zee say` /
# `zee suggest-done` and states that landing is refused — brief a WORKER with it and you have taught
# it four doors it does not have and removed the one it does. Enforced in the DB (054), not by
# convention: assigning it to a worker xell is refused, and so is inheriting across types.
zee_type: manager

# The manager's manual is a manual OF ITS OWN — deliberately NOT the worker's. A manager has verbs a
# worker does not (dispatch/zees/say/inbox/suggest-done) and refusals a worker does not (land, PR,
# any push to the xource), so inheriting the worker law layer would teach it doors it does not have.
# That is also why this harness declares no `parent:`.
memory:
  - memory/manager-zee-manual.md

skills:
  - dispatch-brief
