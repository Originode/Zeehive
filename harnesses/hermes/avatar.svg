  <!-- wings -->
  <path d="M14 26 q10 -6 18 0 q-8 -1 -18 4 z" fill="#7bd0e0"/>
  <path d="M50 26 q-10 -6 -18 0 q8 -1 18 4 z" fill="#7bd0e0"/>
