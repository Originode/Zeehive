# zeehive.yml — ZEEHIVE is a project of ZEEHIVE (docs/deploy-topology-spec.md §6).
# The orchestrator's own shape, CONTAINERIZED spinoffs (compose-authorship decision record):
# a Zeehive xell's app tier is a per-xell compose stack — nested queenzee + web + its own
# meta-DB — generated into docker-compose.spinoff.yml by ZEEHIVE itself (lib/compose-gen.js;
# the file is marked GENERATED and is ZEEHIVE's to regenerate). Containerized spinoffs are what
# makes Zeehive xells PLACEABLE on other machines: the same generated compose runs on any
# daemon via docker --context, and WHERE it runs stays meta-DB data (machine/machine_pool),
# never file content. The §6.2 safety env below is baked into the generated compose too, so a
# nested queenzee is safe even outside the harness.
version: 1
project: zeehive

env:
  file: .env
  example: .env.example
  generated: .zeehive.env

tiers:
  prod:
    compose: docker-compose.yml          # the pinned meta-DB only; prod server/web ship via docker/zeehive/
  spinoff:
    compose: docker-compose.spinoff.yml  # GENERATED — see header comment in the file itself
    ports:
      server: { env: PORT, base: 4800, mod: 90, internal: 4700 }
      webapp: { env: ZEEHIVE_WEB_PORT, base: 5300, mod: 90, internal: 5180 }
      db:     { base: 5500, mod: 90, internal: 5432 }
    # Safety defaults every Zeehive xell inherits — via .zeehive.env for the cage, and baked
    # into the generated compose for the containers: a nested queenzee is a subject under
    # test, not a manager: it provisions nothing real and reaps nothing real.
    env:
      BUILD_MODE: simulate
      PROVISION_MODE: simulate
      SHIP_MODE: simulate
      PROVISION_APP_TIER: "false"
      POOL_TARGET_READY: "0"

roles:
  # service names in a project-OWNED compose (docker-compose.yml for prod); the GENERATED
  # spinoff compose names services by ROLE (build-container.sh contract). dockerfile/build_args
  # feed the generator.
  server: { service: server, buildable: true, dockerfile: docker/zeehive/Dockerfile.server }
  webapp: { service: web, buildable: true, dockerfile: docker/zeehive/Dockerfile.web,
            build_args: { ZEEHIVE_API_UPSTREAM: "server:4700" } }
  db:     { service: db, buildable: false, image: postgres:17-alpine }

naming:
  container: { db: "zeehive_db_spin_{slug}" }

# password is the committed dev credential (same one docker-compose.yml carries) — a process
# xell must SCRAM-authenticate over TCP, unlike a compose sibling reaching its db by alias.
#
# boot_migrations: ZEEHIVE migrates ITSELF — runMigrations() applies db/migrations/*.sql to the
# meta-DB as the new server boots, because a self-ship IS the restart. Declaring it here is what
# lets the SHIP CARD tell the approving human about that schema (ticket #12): without it a deploy
# said "no migrations" while applying five to the live meta-DB. lib/shipmigrate.js also detects
# this shape automatically; the declaration is the explicit version, and `false` opts out.
db: { name: zeehive, user: zeehive, password: zeehive, boot_migrations: db/migrations }
