# GENERATED by ZEEHIVE from zeehive.yml — do not hand-edit; regenerate via the console
# (Project setup → Manifest) or POST /api/projects/:id/compose/generate. A compose file WITHOUT
# this marker is the project's own and ZEEHIVE will never overwrite it.
#
# Standalone (no harness): SPINOFF_SLUG=demo docker compose -f <this file> up
# Under ZEEHIVE: build-container.sh drives it with -p <project> and the SPINOFF_* env.
# No machine facts in here, by design — the same file runs on any daemon via docker --context;
# WHERE a stack runs is meta-DB data (machine/machine_pool), never file content.
services:
  server:
    build:
      context: .
      dockerfile: docker/zeehive/Dockerfile.server
    image: zeehive-spin-server:${SPINOFF_SLUG:-dev}
    container_name: zeehive_spin_server_${SPINOFF_SLUG:-dev}
    restart: unless-stopped
    ports:
      - ${SPINOFF_SERVER_PORT:-4800}:4700
    labels:
      zeehive.project: Zeehive
      zeehive.role: server
      zeehive.slug: ${SPINOFF_SLUG:-dev}
    environment:
      PORT: "4700"
      DATABASE_URL: postgresql://zeehive:zeehive@db:5432/zeehive
      BUILD_MODE: simulate
      PROVISION_MODE: simulate
      SHIP_MODE: simulate
      PROVISION_APP_TIER: "false"
      POOL_TARGET_READY: "0"
    depends_on:
      db:
        condition: service_healthy
  webapp:
    build:
      context: .
      dockerfile: docker/zeehive/Dockerfile.web
      args:
        ZEEHIVE_API_UPSTREAM: server:4700
    image: zeehive-spin-webapp:${SPINOFF_SLUG:-dev}
    container_name: zeehive_spin_webapp_${SPINOFF_SLUG:-dev}
    restart: unless-stopped
    ports:
      - ${SPINOFF_WEB_PORT:-5300}:5180
    labels:
      zeehive.project: Zeehive
      zeehive.role: webapp
      zeehive.slug: ${SPINOFF_SLUG:-dev}
  db:
    image: postgres:17-alpine
    container_name: zeehive_db_spin_${SPINOFF_SLUG:-dev}
    restart: unless-stopped
    ports:
      - ${SPINOFF_DB_PORT:-5500}:5432
    environment:
      POSTGRES_USER: zeehive
      POSTGRES_PASSWORD: zeehive
      POSTGRES_DB: zeehive
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U zeehive
      interval: 5s
      timeout: 3s
      retries: 20
    labels:
      zeehive.project: Zeehive
      zeehive.role: db
      zeehive.slug: ${SPINOFF_SLUG:-dev}
